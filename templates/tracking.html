
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drone Tracking | Smart Drone Eats</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .tracking-info {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>🚁 Smart Drone Delivery Tracking</h1>

    <div class="tracking-info">
        <h3>Order #{{ order.id }}</h3>
        <p>Restaurant: {{ order.restaurant_name }}</p>
        <p>Delivery Address: {{ order.address }}</p>
        <p>Status: {{ order.status }}</p>
        <p id="drone-status">Preparing tracking map...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const routePoints = {{ map_route | tojson }};

        const mapCoordinates = {{ map_coordinates | tojson }};

        const map = L.map('map').setView([15.5100, 80.0550], 14);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        const coordinates = routePoints.map(
            point => point.coordinates
        );

        if (coordinates.length > 0) {

            const routeLine = L.polyline(
                coordinates,
                {
                    color: 'blue',
                    weight: 5
                }
            ).addTo(map);

            map.fitBounds(routeLine.getBounds(), {
                padding: [30, 30]
            });

            L.marker(coordinates[0])
                .addTo(map)
                .bindPopup('Restaurant Pickup');

            L.marker(coordinates[coordinates.length - 1])
                .addTo(map)
                .bindPopup('Customer Delivery');

            const droneIcon = L.divIcon({
    html: '<div style="font-size:30px; width:40px; height:40px; text-align:center; line-height:40px;">🚁</div>',
    className: '',
    iconSize: [40, 40],
    iconAnchor: [20, 20]
});

            const droneMarker = L.marker(
                coordinates[0],
                { icon: droneIcon }
            ).addTo(map);

            let currentPoint = 0;

            document.getElementById('drone-status').innerText =
                'Drone is ready for simulated tracking.';

            setInterval(() => {

                if (currentPoint < coordinates.length - 1) {

                    currentPoint++;

                    droneMarker.setLatLng(
                        coordinates[currentPoint]
                    );

                    document.getElementById('drone-status').innerText =
                        'Drone progress: ' +
                        Math.round(
                            currentPoint /
                            (coordinates.length - 1) * 100
                        ) + '%';

                } else {

                    document.getElementById('drone-status').innerText =
                        'Simulated delivery route completed.';

                }

            }, 3000);

        } else {

            document.getElementById('drone-status').innerText =
                'No route coordinates available.';
        }
    </script>

</body>
</html>
